import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'idea'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.1.6'
    id 'eclipse'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

configurations.configureEach {
    resolutionStrategy {
        force 'com.google.guava:guava:32.1.3-jre'
    }
}

def versionProps = new Properties()
file('version.properties').withInputStream { versionProps.load(it) }

def gradleProps = new Properties()
file('gradle.properties').withInputStream { gradleProps.load(it) }

def stage = versionProps.getProperty('stage') ?: ''
def buildNumber = versionProps.getProperty('build_number') ?: '0'

version = "${versionProps.getProperty('version')}-b${buildNumber}-${stage}"
group = 'mctmods.immersivefabrication'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

ext {
    mod_id = gradleProps['mod_id']
    version_minecraft = versionProps['version_mc']
    version_neoforge = versionProps['version_neoforge']
    version_neoforge_min = versionProps['version_neoforge_min']
    version_parchment = versionProps['version_parchment']
    version_ic = versionProps.getProperty('version_ic', '[0,)')
    version_ic_curse = versionProps['version_ic_curse']
    version_dualcodecs = versionProps['version_dualcodecs']
}

def version_replaces = [
        'version'             : project.version,
        'version_mc'          : version_minecraft,
        'version_neoforge'    : version_neoforge,
        'version_neoforge_min': version_neoforge_min,
        'version_ic'          : version_ic,
]

processResources {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    inputs.properties(version_replaces)
    filesMatching('META-INF/*.mods.toml') {
        expand version_replaces
    }
    exclude '.cache'
    doLast {
        destinationDir.eachFileRecurse { File file ->
            if (file.file && (file.name.endsWith('.json') || file.name.endsWith('.mcmeta'))) {
                file.setText(JsonOutput.toJson(new JsonSlurper().parse(file, 'UTF-8')))
            }
        }
    }
}

def devSyncScript = null
for (def dir = rootDir; dir != null && devSyncScript == null; dir = dir.parentFile) {
    def candidate = new File(dir, '#scripts/gradle/mods-devsync.gradle')
    if (candidate.isFile()) { devSyncScript = candidate }
}
if (devSyncScript != null) { apply from: devSyncScript }

def icJar = devSyncScript == null ? null : devSyncStaged(devSyncPin('ImmersiveConvergence-21', versionProps['devsync_ic']), 'build/devsync-pins/ImmersiveConvergence-21.jar')
if (icJar == null) { logger.warn('No IC devSync pin: set devsync_ic in version.properties to a snapshot in the devsync cache') }

def itJar = devSyncScript == null ? null : devSyncStaged(devSyncPin('MCT-Immersive-Technology-21', versionProps['devsync_it']), 'build/devsync-pins/MCT-Immersive-Technology-21.jar')
if (itJar == null) { logger.warn('No IT devSync pin: set devsync_it in version.properties to a snapshot in the devsync cache') }

sourceSets {
    main {
        resources {
            srcDirs = [
                    "$rootDir/src/main/resources",
                    "$rootDir/src/generated/resources",
            ]
        }
    }
    datagen {
        java { srcDirs = ["$rootDir/src/datagen/java"] }
        resources { srcDirs = ["$rootDir/src/datagen/resources"] }
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
}

gradle.projectsEvaluated {
    layout.buildDirectory.dir('classes/java/datagen').get().asFile.mkdirs()
    layout.buildDirectory.dir('resources/datagen').get().asFile.mkdirs()
}

tasks.register('prepareDatagenOutputs') {
    dependsOn datagenClasses, processResources
    def outputDirs = [layout.buildDirectory.dir('classes/java/datagen'), layout.buildDirectory.dir('resources/datagen')]
    doFirst { outputDirs.each { it.get().asFile.mkdirs() } }
}

afterEvaluate {
    tasks.named('runData').configure { dependsOn('prepareDatagenOutputs') }
}

neoForge {
    version = project.version_neoforge

    parchment {
        mappingsVersion = project.version_parchment
        minecraftVersion = project.version_minecraft
    }

    accessTransformers.from file('src/main/resources/META-INF/accesstransformer.cfg')
    validateAccessTransformers = true

    mods.register(mod_id as String) {
        sourceSet(sourceSets.main)
        sourceSet(sourceSets.datagen)
    }

    runs {
        configureEach {
            jvmArgument '-Xmx4G'
            gameDirectory = layout.projectDirectory.dir('run')
        }
        client {
            client()
            programArguments.addAll '--username', 'tgstyle', '--width', '1920', '--height', '1080'
            jvmArgument('-Djava.library.path=/usr/lib64')
            jvmArgument('-XX:StartFlightRecording=maxsize=512M,dumponexit=true,filename=logs/profile.jfr,settings=profile')
            environment 'LD_LIBRARY_PATH', '/usr/lib64'
        }
        server {
            server()
            programArguments.addAll '--nogui'
            jvmArgument('-XX:StartFlightRecording=maxsize=512M,dumponexit=true,filename=logs/profile.jfr,settings=profile')
        }
        data {
            data()
            sourceSet = sourceSets.datagen
            programArguments.addAll '--mod', mod_id.toString(), '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' ; content { includeGroup 'malte0811' ; includeGroup 'mezz.jei' } }
    maven { url = 'https://www.cursemaven.com' ; content { includeGroup 'curse.maven' } }
    maven { url = 'https://cfa2.cursemaven.com' ; content { includeGroup 'curse.maven' } }
    maven { name = 'ParchmentMC' ; url = 'https://ldtteam.jfrog.io/artifactory/parchmentmc-public/' }
}

dependencies {
    if (icJar != null) {
        implementation files(icJar)
    } else {
        logger.warn('Falling back to CurseMaven for ImmersiveConvergence')
        implementation "curse.maven:${version_ic_curse}"
    }
    if (itJar != null) {
        runtimeOnly files(itJar)
        runtimeOnly "malte0811:DualCodecs:${version_dualcodecs}"
    }
    runtimeOnly "mezz.jei:jei-${version_minecraft}-neoforge:${versionProps['version_jei']}"
    runtimeOnly "curse.maven:${versionProps['version_jade_curse']}"
    runtimeOnly "curse.maven:${versionProps['version_top_curse']}"
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

idea { module { downloadSources = true; downloadJavadoc = true } }
