import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'idea'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.1.6'
    id 'eclipse'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

configurations.configureEach {
    resolutionStrategy {
        force 'com.google.guava:guava:32.1.3-jre'
    }
}

def versionProps = new Properties()
file('version.properties').withInputStream { versionProps.load(it) }

def gradleProps = new Properties()
file('gradle.properties').withInputStream { gradleProps.load(it) }

def stage = versionProps.getProperty('stage') ?: ''
def buildNumber = versionProps.getProperty('build_number') ?: '0'

version = "${versionProps.getProperty('version')}-b${buildNumber}-${stage}"
group = 'mctmods.immersivefabrication'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

ext {
    mod_id = gradleProps['mod_id']
    version_minecraft = versionProps['version_mc']
    version_neoforge = versionProps['version_neoforge']
    version_neoforge_min = versionProps['version_neoforge_min']
    version_parchment = versionProps['version_parchment']
    version_ic = versionProps.getProperty('version_ic', '[0,)')
    version_ic_curse = versionProps['version_ic_curse']
}

def version_replaces = [
        'version'             : project.version,
        'version_mc'          : version_minecraft,
        'version_neoforge'    : version_neoforge,
        'version_neoforge_min': version_neoforge_min,
        'version_ic'          : version_ic,
]

processResources {
    inputs.properties(version_replaces)
    filesMatching('META-INF/*.mods.toml') {
        expand version_replaces
    }
    doLast {
        destinationDir.eachFileRecurse { File file ->
            if (file.file && (file.name.endsWith('.json') || file.name.endsWith('.mcmeta'))) {
                file.setText(JsonOutput.toJson(new JsonSlurper().parse(file, 'UTF-8')))
            }
        }
    }
}

def devSyncScript = null
for (def dir = rootDir; dir != null && devSyncScript == null; dir = dir.parentFile) {
    def candidate = new File(dir, '#scripts/mods-devsync.gradle')
    if (candidate.isFile()) { devSyncScript = candidate }
}
if (devSyncScript != null) { apply from: devSyncScript }

def icJar = devSyncScript == null ? null : devSyncStaged(devSyncPin('ImmersiveConvergence-21', versionProps['devsync_ic']), 'build/devsync-pins/ImmersiveConvergence-21.jar')
if (icJar == null) { logger.warn('No IC devSync pin: set devsync_ic in version.properties to a snapshot in the devsync cache') }

neoForge {
    version = project.version_neoforge

    parchment {
        mappingsVersion = project.version_parchment
        minecraftVersion = project.version_minecraft
    }

    mods {
        register(mod_id.toString()) { mod ->
            mod.modSourceSets.add(sourceSets.main)
        }
    }

    runs {
        configureEach {
            jvmArgument '-Xmx4G'
            gameDirectory = layout.projectDirectory.dir('run')
        }
        client {
            client()
            programArguments.addAll '--username', 'tgstyle', '--width', '1920', '--height', '1080'
            jvmArgument('-Djava.library.path=/usr/lib64')
            jvmArgument('-XX:StartFlightRecording=maxsize=512M,dumponexit=true,filename=logs/profile.jfr,settings=profile')
            environment 'LD_LIBRARY_PATH', '/usr/lib64'
        }
        server {
            server()
            programArguments.addAll '--nogui'
            jvmArgument('-XX:StartFlightRecording=maxsize=512M,dumponexit=true,filename=logs/profile.jfr,settings=profile')
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://www.cursemaven.com' ; content { includeGroup 'curse.maven' } }
    maven { url = 'https://cfa2.cursemaven.com' ; content { includeGroup 'curse.maven' } }
    maven { name = 'ParchmentMC' ; url = 'https://ldtteam.jfrog.io/artifactory/parchmentmc-public/' }
}

dependencies {
    if (icJar != null) {
        implementation files(icJar)
    } else {
        logger.warn('Falling back to CurseMaven for ImmersiveConvergence')
        implementation "curse.maven:${version_ic_curse}"
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

idea { module { downloadSources = true; downloadJavadoc = true } }
