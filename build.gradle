import java.security.MessageDigest

plugins {
    id 'idea'
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2'
}

class JarStamp {
    static String hash(Set<File> files, File versionProps, File root) {
        def digest = MessageDigest.getInstance('SHA-256')
        files.sort { it.path }.each { File file ->
            digest.update(root.toPath().relativize(file.toPath()).toString().getBytes('UTF-8'))
            digest.update(file.bytes)
        }
        versionProps.readLines().findAll { !it.startsWith('#') && !it.startsWith('build_number=') }.sort().each { digest.update(it.getBytes('UTF-8')) }
        digest.digest().encodeHex().toString()
    }

    static boolean changed(Set<File> files, File versionProps, File root, File stamp) { !stamp.isFile() || stamp.text != hash(files, versionProps, root) }
}

ext.configFile = file '../common/common-1.12.properties'

configFile.withReader {
    def prop = new Properties()
    prop.load(it)
    ext.common = new ConfigSlurper().parse prop
}

def versionProps = new Properties()
file('version.properties').withInputStream { versionProps.load(it) }

def gradleProps = new Properties()
file('gradle.properties').withInputStream { gradleProps.load(it) }

def devSyncScript = null
for (def dir = rootDir; dir != null && devSyncScript == null; dir = dir.parentFile) {
    def candidate = new File(dir, '#scripts/mods-devsync.gradle')
    if (candidate.isFile()) { devSyncScript = candidate }
}
if (devSyncScript != null) {
    apply from: devSyncScript
    build.finalizedBy 'devSync'
}

def icJar = devSyncScript == null ? null : devSyncStaged(devSyncPin('ImmersiveConvergence-Legacy', versionProps['devsync_ic']), 'build/devsync-pins/ImmersiveConvergence-Legacy.jar')
if (icJar == null) { logger.warn('No Immersive Convergence devSync pin: set devsync_ic in version.properties to a snapshot in the devsync cache') }

def stampInputs = files(sourceSets.main.java.srcDirs, sourceSets.main.resources.srcDirs, file('build.gradle'), file('gradle.properties'), configFile, icJar == null ? [] : icJar).asFileTree
def stampProps = file('version.properties')
def stampRoot = rootDir
def stampFile = layout.buildDirectory.file('jar-inputs.sha256')
def currentBuild = versionProps.getProperty('build_number')?.toInteger() ?: 0
def builtJar = layout.buildDirectory.file("libs/${gradleProps['modarchivename']}-${common.mcversion}-${versionProps.getProperty('version')}.${currentBuild}-${versionProps.getProperty('stage') ?: ''}.jar")
def needsJar = { !builtJar.get().asFile.isFile() || JarStamp.changed(stampInputs.files, stampProps, stampRoot, stampFile.get().asFile) }

def building = gradle.startParameter.taskNames*.toLowerCase().findAll { !(it ==~ /(.*:)?dev(jar|sync)/) }.any { it.contains('build') || it.contains('jar') || it.contains('assemble') }
if (building && needsJar()) {
    versionProps['build_number'] = ((versionProps.getProperty('build_number')?.toInteger() ?: 0) + 1).toString()
    file('version.properties').withOutputStream { versionProps.store(it, null) }
}

ext.modversion = versionProps.getProperty('version')
ext.version_buildnumber = versionProps.getProperty('build_number')?.toInteger() ?: 0
ext.stage = versionProps.getProperty('stage') ?: ''

version = "${common.mcversion}-${modversion}.${version_buildnumber}-${stage}"

println "-> build.gradle applying version: $version"

group = modgroup

ext {
    mod_id = gradleProps['mod_id']
    mod_name = gradleProps['mod_name']
    mod_authors = gradleProps['mod_authors']
    mod_description = gradleProps['mod_description']
    mod_url = gradleProps['mod_url']
}

base { archivesName = modarchivename }

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
        vendor = JvmVendorSpec.ADOPTIUM
    }
}

minecraft {
    mcVersion = '1.12.2'
    mcpMappingChannel = 'stable'
    mcpMappingVersion = common.mcp_mappings.toString().split('-')[0]
    username = 'TGstyle'
    extraRunJvmArguments.addAll(
            '-Xmx4G',
            '-Dfml.coreMods.load=com.immersiveconvergence.core.ICMixin',
            '-Dforge.logging.console.level=debug'
    )
}

repositories {
    maven {
        url = "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://maven.minecraftforge.net' }
    maven { url = 'https://maven.cleanroommc.com' }
    mavenCentral()
}

dependencies {
    if (icJar != null) {
        implementation files(icJar)
    } else {
        implementation(rfg.deobf("curse.maven:${common.imco_version}") as String)
    }
    runtimeOnly('zone.rong:mixinbooter:10.7') { transitive = false }
}

tasks.named('runClient').configure {
    extraArgs.addAll('--width', '1920', '--height', '1080')
}

tasks.named('runServer').configure {
    workingDir = file('run/server')
}

processResources {
    inputs.property('version', providers.provider { "${modversion}.${version_buildnumber}" })
    inputs.property 'mcversion', common.mcversion
    filesMatching(['mcmod.info', 'pack.mcmeta']) {
        expand 'version': "${modversion}.${version_buildnumber}", 'mcversion': common.mcversion,
                'mod_id': mod_id, 'mod_name': mod_name,
                'mod_authors': mod_authors, 'mod_description': mod_description,
                'mod_url': mod_url
    }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    onlyIf { needsJar() }
}

tasks.named('reobfJar').configure {
    onlyIf { needsJar() }
    doLast { stampFile.get().asFile.text = JarStamp.hash(stampInputs.files, stampProps, stampRoot) }
}

sourceSets.configureEach { it.output.resourcesDir = it.output.classesDirs.getFiles().iterator().next() }
